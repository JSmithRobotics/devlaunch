schema_version: 1

context:
  # The version is read, not written. `rust/Cargo.toml`'s `[workspace.package]
  # version` is the one place it lives (docs/rust-rewrite-plan.md M10), and every
  # other reader -- this recipe, the PyPI wheel's metadata, `dl --version` --
  # resolves to it rather than repeating it. A release is one edit.
  version: ${{ load_from_file("../rust/Cargo.toml").workspace.package.version }}

  # The source repo, overridable so a fork's build fetches the fork's own code
  # rather than upstream's. Unset -- a developer render, or upstream's own CI --
  # resolves to upstream, exactly as before this variable existed.
  # `.github/workflows/conda-publish.yml` sets DEVLAUNCH_SOURCE_REPO on the build
  # step to `https://github.com/${{ github.repository }}`, which is what makes a
  # fork's publish fetch and ship the fork's own code instead of silently
  # building and publishing upstream's under the fork's name.
  #
  # Held WITHOUT the `.git` suffix: `source.git` appends it below and `about.*`
  # wants the browsable URL. The reverse (holding it with `.git` and stripping
  # for `about.*`) needs a global `replace(".git", "")`, which silently corrupts
  # any repository named `<owner>.github.io` -- an idiomatic GitHub name.
  repo_url: ${{ env.get("DEVLAUNCH_SOURCE_REPO", default="https://github.com/blooop/devlaunch") }}

package:
  name: devlaunch
  version: ${{ version }}

source:
  # Still the tag rather than the working tree, which is the ordering requirement
  # `.github/workflows/conda-publish.yml` is built around: Auto-publish creates
  # the tag, and only then can this fetch it.
  git: ${{ repo_url }}.git
  tag: v${{ version }}

build:
  number: 0
  # No longer `noarch: python`: as of 0.1.0 the package is two compiled binaries,
  # built natively for linux-64 and linux-aarch64, and carries no Python at all.
  script:
    # Both binaries come out of the `dl` package -- its own `dl`, and an `aid`
    # compiled from `rust/aid/src/main.rs` behind the `wheel` feature, which is
    # the arrangement `rust/dl/Cargo.toml` explains and the one the PyPI wheel
    # ships from too. One `cargo install` for both, so the two channels cannot
    # ship different sets.
    #
    # `--locked` is the point of building from a tag: the dependency versions are
    # `rust/Cargo.lock`'s, not whatever crates.io holds on release day.
    # `--no-track` keeps cargo's install ledger (`.crates.toml`,
    # `.crates2.json`) out of `$PREFIX`, where it would be shipped as package
    # content.
    - cargo install --locked --no-track --features wheel --bins --path rust/dl --root "${PREFIX}"

requirements:
  build:
    # The C compiler is here for the linker and its sysroot, which is what makes
    # the binaries runnable on a glibc older than the build machine's.
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
  run:
    # Floor raised from 0.8 to the version dl is developed and tested against.
    # dl's behaviour depends on devpod's, and the two differ across that range:
    # 0.8 gives `devpod ssh --command` a pty, 0.26 does not. Claiming support
    # for a span nothing exercises is how that difference went unnoticed.
    - devpod >=0.26.1
    # `python`, `iterfzf` and `tomli` were run dependencies through 0.0.29 and are
    # not any more: the selector is embedded skim (docs/rust-rewrite-plan.md
    # divergence row 6), TOML is parsed in-process, and there is no interpreter
    # left to need. `git` stays undeclared for the same reason it always was --
    # `dl` resolves it from the user's PATH, and an env-local copy would not be
    # the one it finds.

tests:
  - script:
      - dl --help
      - aid --help
      # The version is single-sourced, so the artifact is the place to prove it:
      # this fails if the binary in the package disagrees with the version the
      # package was built and named under.
      - test "$(dl --version)" = "dl ${{ version }}"
      - test "$(aid --version)" = "aid ${{ version }}"

about:
  homepage: ${{ repo_url }}
  license: MIT
  license_file: LICENSE
  summary: DevLaunch - A streamlined CLI for devpod workspaces
  description: |
    DevLaunch provides a streamlined interface for devpod workspaces with
    interactive workspace selection using an embedded fuzzy finder, intuitive
    autocomplete functionality, and GitHub integration.
  documentation: ${{ repo_url }}#readme
  repository: ${{ repo_url }}

extra:
  recipe-maintainers:
    # A person, not a publish location: this is who maintains the recipe, and
    # upstream's own recipe already names itself here. It does not move with
    # `repo_url` and a fork does not need to touch it.
    - blooop
